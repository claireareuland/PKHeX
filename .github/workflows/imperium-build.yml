name: Build PKHeX Imperium

on:
  push:
    branches:
      - emerald-imperium-v131
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PKHeX.sln

      - name: Publish
        run: dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o artifacts/PKHeX-Imperium

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-Imperium-win-x64
          path: artifacts/PKHeX-Imperium/
